name: build

# A push to main builds and publishes: the release is public, the tag is unique per run, and the
# in-app updater (releases/latest) picks it up on its own. The version is injected into the build
# workspace only, so no build number is ever committed.
on:
  push:
    branches: [main]
  # Manual runs: pick ANY branch in the UI (hotfix without touching main). The run number is
  # repo-global and monotonic, so a hotfix build is still greater than anything released before.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the build version
        # Each run is its own release, so each run needs a version no console has seen. The version
        # is 1.<run>.0: the committed base stays 1.0.4 and every run is strictly greater, so the
        # in-app updater (which only installs a strictly greater version) always accepts it. The PS5
        # content version gets its own half (packager requires NN.NNN.NNN). The stamp lives in the
        # build workspace only, so no build number is ever committed.
        run: |
          run=${{ github.run_number }}
          python3 - "$run" <<'PY'
          import json, pathlib, re, sys
          run = int(sys.argv[1])
          # The updater compares component-wise (Number per part) and only installs a strictly
          # greater version, so 1.9.0 < 1.10.0 needs no zero padding.
          p = pathlib.Path("app/version.js")
          p.write_text(re.sub(r'var VERSION = "[^"]*"',
                              f'var VERSION = "1.{run}.0"', p.read_text()), encoding="utf-8")
          # The packager requires NN.NNN.NNN (three zero-padded digits per part).
          p = pathlib.Path("app/app.json")
          c = json.loads(p.read_text(encoding="utf-8"))
          c["version"] = f"01.{run:03d}.000"
          p.write_text(json.dumps(c, indent=2) + "\n", encoding="utf-8")
          PY
          cp -a app "$RUNNER_TEMP/app"
          echo "APP_DIR=$RUNNER_TEMP/app" >> "$GITHUB_ENV"
          grep 'var VERSION' app/version.js
          grep '"version"' "$RUNNER_TEMP/app/app.json"

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 llvm-18 llvm-18-dev cmake ninja-build nodejs npm python3-venv \
            zlib1g-dev build-essential pkg-config unzip zip curl zstd exfatprogs exfat-fuse \
            nasm
          # The build wants unversioned clang and llvm-config in --llvm.
          for tool in clang clang++ llvm-config; do
            sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"
          done
          clang --version | head -1
          llvm-config --version
          nasm --version

      - name: Install the Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -r ps5-react/requirements.txt
          # The build spawns python3 for its own tools, so the venv goes on PATH.
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check the exfat packaging
        run: |
          mkdir -p "$RUNNER_TEMP/check/payload"
          printf 'eboot' > "$RUNNER_TEMP/check/payload/eboot.bin"
          # Big enough that the image gets the same geometry as the real one.
          head -c 24000000 /dev/urandom > "$RUNNER_TEMP/check/payload/data.bin"
          sudo bash packaging/make-exfat.sh "$RUNNER_TEMP/check/payload" \
            "$RUNNER_TEMP/check/check.exfat" CHECK

      - name: Cache the downloaded sources
        uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: deps-${{ hashFiles('ps5-react/dependencies.lock.json') }}

      - name: Build
        working-directory: ps5-react
        run: |
          python3 tools/build_ps5.py --app-dir "$APP_DIR" --llvm /usr/bin
          # The linked ELF before it is SELF-signed into eboot.bin, kept for reference next to
          # the launcher payload below; the console cannot run this file directly.
          cp .build/app/ps5/eboot.elf "$GITHUB_WORKSPACE/PadrinoStore.elf"
          # The launcher payload: opens an installed store from the payload loader (9021).
          cp .build/app/ps5/padrino-launcher.elf "$GITHUB_WORKSPACE/PadrinoStore-launcher.elf"
          ls -l "$GITHUB_WORKSPACE/PadrinoStore.elf" "$GITHUB_WORKSPACE/PadrinoStore-launcher.elf"

      - name: Package
        run: |
          sudo bash packaging/make-exfat.sh ps5-react/dist/PPSA99059 PadrinoStore.exfat PADRINO
          # The in-app updater fetches one name, for an image install: the image
          # alone at the root of update.zip.
          zip -q -X -j update.zip PadrinoStore.exfat
          # update-app.zip: the full app folder, for a folder install (data/homebrew/PPSA99059).
          # The updater extracts it over the install dir with backup + rollback.
          (cd ps5-react/dist && zip -q -X -r "$GITHUB_WORKSPACE/update-app.zip" PPSA99059)
          # update-elf.zip: the payload ELF alone at the root, for a payload run. The
          # updater writes it to /data/ps5-react/PPSA99059/PadrinoStore.elf; the user
          # reloads the payload. PadrinoStore.elf stays loose for a manual download.
          zip -q -X -j update-elf.zip PadrinoStore.elf
          unzip -l update.zip
          unzip -l update-app.zip | head -20
          unzip -l update-elf.zip
          ls -l PadrinoStore.exfat update.zip update-app.zip PadrinoStore.elf update-elf.zip ps5-react/dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Padrino Store
          path: |
            PadrinoStore.exfat
            update.zip
            update-app.zip
            PadrinoStore.elf
            update-elf.zip
            PadrinoStore-launcher.elf
            ps5-react/dist/PPSA99059.receipt.json
          if-no-files-found: error

      - name: Publish the release
        # The tag is stamped from the run number, so it is always greater than what a console has
        # already installed, and the feed (releases/latest) always points here. update.zip is the
        # asset for an image install; update-app.zip is the asset for a folder install;
        # update-elf.zip is the asset for a payload run (PadrinoStore.elf is also attached loose
        # for a manual download); PadrinoStore-launcher.elf opens an installed store from the
        # payload loader. Release body = CHANGELOG.md section for the upcoming release
        # (in-app "what's new" list). Only a push to main publishes: a workflow_dispatch run on a
        # test branch builds the same artifacts and stops there, so an update can be tried on a
        # console before anyone else receives it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=${{ github.run_number }}
          sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          tag="v1.$run"
          assets="PadrinoStore.exfat update.zip update-app.zip PadrinoStore.elf update-elf.zip PadrinoStore-launcher.elf"
          # Body: everything under "## Próxima release" until "## Archivo", else the file, else a one-liner.
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            awk '
              /^## Próxima release/ { grab=1; next }
              /^## Archivo/ { grab=0 }
              grab { print }
            ' CHANGELOG.md > "$notes_file"
            # Trim leading blank lines
            sed -i '/./,$!d' "$notes_file"
          fi
          if [ ! -s "$notes_file" ]; then
            echo "Padrino Store v1.$run — build $run ($sha)." > "$notes_file"
          fi
          echo "Release notes preview:"; cat "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes_file"
            gh release upload "$tag" $assets --clobber
          else
            gh release create "$tag" $assets --target "$GITHUB_SHA" \
              --title "Padrino Store $tag" --notes-file "$notes_file"
          fi
          gh release view "$tag" --json tagName,isDraft,assets \
            --jq '"\(.tagName) draft=\(.isDraft) " + ([.assets[] | "\(.name) \(.size)"] | join(", "))'
          # Mirror of the release as JSON for the in-app updater: same shape served from
          # raw.githubusercontent, so the check still works when api.github.com is unreachable
          # from the console. [skip ci] keeps this bot commit from starting another build.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" \
            --jq '{tag_name, body, assets: [.assets[] | {name, size, digest, browser_download_url}]}' \
            > update-feed.json || echo "feed mirror skipped"
          if [ -s update-feed.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add update-feed.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: refresh update feed mirror [skip ci]" || echo "feed mirror commit skipped"
              # --autostash: the version stamp leaves version.js/app.json modified in the workspace.
              git pull --rebase --autostash origin main && git push origin main \
                || echo "feed mirror push skipped (release already published)"
            fi
          fi
